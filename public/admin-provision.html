<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provisionamento de usuários • SuperPWA</title><style>body{font:16px system-ui;background:#f5f6fa;color:#182132;max-width:650px;margin:36px auto;padding:18px}main{background:white;border-radius:14px;padding:24px;box-shadow:0 4px 25px #0001}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #aaa;margin:6px 0;width:100%;box-sizing:border-box}button{background:#203d85;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}article{padding:14px 0;border-bottom:1px solid #ddd}small{color:#666}#status{white-space:pre-wrap}</style></head><body><main><h1>Provisionamento de usuários</h1><p>Área exclusiva do administrador SaaS. Use a senha criada no Supabase Auth. As novas senhas devem ter ao menos 12 caracteres e serão utilizadas pelos funcionários no PWA após a migração.</p><section id="login"><label>E-mail administrativo<input id="email" type="email" value="200309@superpwa.app" autocomplete="username"></label><label>Senha administrativa<input id="password" type="password" autocomplete="current-password"></label><button id="enter">Entrar com Supabase Auth</button></section><section id="admin" hidden><p id="who"></p><button id="logout">Sair</button><div id="users"></div></section><p id="status" role="status"></p></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.49.4";
const client=createClient("https://senbgpiuhjtlpnhvpykh.supabase.co","sb_publishable_8T__DxVCm4aYMJB_pGtIeA_79V65KbL");
const entries=[["usr_mgr_1795006914310","DIEGO-2026"],["usr_emp_1795007004248","JOSEN-2026"],["usr_emp_1795007042671","WELIG-2026"],["usr_emp_1795014682300","JOSIC-2026"],["usr_emp_1795014718028","DERLA-2026"],["usr_emp_1795266995721","PEPSI-1565"]];
const status=document.querySelector("#status"), login=document.querySelector("#login"),admin=document.querySelector("#admin"),users=document.querySelector("#users");
const say=t=>status.textContent=t;
async function refresh(){const{data:{user}}=await client.auth.getUser();login.hidden=!!user;admin.hidden=!user;if(user){document.querySelector("#who").textContent="Sessão: "+user.email;users.replaceChildren();for(const[id,matricula]of entries){const article=document.createElement("article"),title=document.createElement("strong"),field=document.createElement("input"),button=document.createElement("button");title.textContent=matricula;field.type="password";field.placeholder="Nova senha (mínimo 12 caracteres)";field.autocomplete="new-password";button.textContent="Provisionar "+matricula;button.onclick=async()=>{if(field.value.length<12){say("A senha deve ter no mínimo 12 caracteres.");return}button.disabled=true;try{const{data:{session}}=await client.auth.getSession();if(!session)throw Error("Sessão expirada");const res=await fetch("https://senbgpiuhjtlpnhvpykh.supabase.co/functions/v1/provision-store-user",{method:"POST",headers:{"content-type":"application/json","apikey":"sb_publishable_8T__DxVCm4aYMJB_pGtIeA_79V65KbL","authorization":"Bearer "+session.access_token},body:JSON.stringify({user_id:id,password:field.value})});const data=await res.json();if(!res.ok)throw Error(data.error||"Falha");field.value="";button.textContent="Provisionado";say(matricula+" vinculado com sucesso.");}catch(e){say("Erro em "+matricula+": "+e.message);button.disabled=false}};article.append(title,field,button);users.append(article)}}}
document.querySelector("#enter").onclick=async()=>{say("Autenticando...");const{error}=await client.auth.signInWithPassword({email:document.querySelector("#email").value.trim(),password:document.querySelector("#password").value});document.querySelector("#password").value="";if(error){say("Credenciais inválidas ou acesso indisponível.");return}say("Sessão autenticada.");await refresh()};
document.querySelector("#logout").onclick=async()=>{await client.auth.signOut();await refresh()};
await refresh();
</script></body></html>
