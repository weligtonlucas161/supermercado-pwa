<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>

  <!-- Inner subtle glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Supermarket Cart / Shopping Basket & Scanner Graphic -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Cart / Bag Body -->
    <path d="M48 96 L272 96 L248 248 C246 264, 232 276, 216 276 L104 276 C88 276, 74 264, 72 248 Z" 
          fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Cart Handle Arch -->
    <path d="M112 96 C112 52, 208 52, 208 96" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Barcode Stripes on Bag -->
    <rect x="96" y="136" width="12" height="84" rx="4" fill="#059669"/>
    <rect x="120" y="136" width="20" height="84" rx="4" fill="#059669"/>
    <rect x="152" y="136" width="10" height="84" rx="4" fill="#059669"/>
    <rect x="174" y="136" width="24" height="84" rx="4" fill="#059669"/>
    <rect x="210" y="136" width="14" height="84" rx="4" fill="#059669"/>

    <!-- Laser Scan Line -->
    <line x1="60" y1="178" x2="260" y2="178" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <circle cx="64" cy="178" r="7" fill="#ef4444"/>
    <circle cx="256" cy="178" r="7" fill="#ef4444"/>
  </g>
</svg>
